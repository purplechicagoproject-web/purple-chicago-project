# Media list for scripts/optimize-media. Sources live in images/results/
# (originals, gitignored); outputs go to images/results-web/.
# Fields are separated by "|". Output names are forced to lowercase-hyphen.
#
# video | source file | output name | start second
#   Keeps 8 seconds from the start second, no audio, 960px wide H.264,
#   <= 1.5 MB, plus a poster jpg (the clip's first frame) with the same name.
#   All recordings show the page's own top screen at 0s, so every clip
#   starts at 0. press and chicago-trip-guide pass a mostly blank page
#   bottom around 3s; raise their start second here if that bothers you.
video | fan-event-hub.mov        | fan-event-hub        | 0
video | stadium-info.mov         | stadium-info         | 0
video | pilgrimage2.mov          | pilgrimage           | 0
video | transportation-guide.mov | transportation-guide | 0
video | press.mov                | press                | 0
video | essentials-tips.mov      | essentials-tips      | 0
video | chicago-trip-guide.mov   | chicago-trip-guide   | 0

# image | source file | output name | max long side px (never upscaled) | png or jpg
image | open-door.png          | open-door         | 400  | png
image | logo.png               | logo              | 600  | png
image | Where ARMY Stayed.png  | where-army-stayed | 1260 | jpg
# Door cards (B1) and the Mayor video poster: existing site illustrations.
image | chicago-flg.png        | chicago-flag      | 480  | png
image | chicago-purple2.png    | landmarks         | 400  | png

# still | site path | output name | CSS selectors to hide (optional)
#   Captured with headless Chrome at the same 2356x1158 frame as the screen
#   recordings, raw PNG kept in images/results/stills/, web jpg 960px wide.
#   The map page opens its "All Partners" list on desktop, which shows
#   business names, so that panel is hidden for the capture only.
#   Partner Toolkit is intentionally absent (password-gated partner page).
still | /official-welcome.html | official-welcome
still | /map/                  | welcome-partners-map | #detail-panel, #panel-backdrop
still | /about-contact.html    | about-contact
# Press band (F): ARMY illustration, tinted purple in CSS.
image | army1.png              | army-cheer        | 480  | png
